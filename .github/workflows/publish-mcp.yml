name: Publish to PyPI and MCP Registry

# Publishes on a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The MCP Registry stores metadata only, so the PyPI package must be published
# first; the registry then verifies ownership via the `mcp-name` marker in the
# package README.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: PyPI trusted publishing + MCP Registry auth
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version from tag into pyproject.toml and server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"
          python - "$VERSION" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          # pyproject.toml
          pp = open("pyproject.toml").read()
          pp = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', pp, count=1)
          open("pyproject.toml", "w").write(pp)
          # server.json (top-level + each package version)
          data = json.load(open("server.json"))
          data["version"] = version
          for pkg in data.get("packages", []):
              pkg["version"] = version
          json.dump(data, open("server.json", "w"), indent=2)
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish package to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish metadata to the MCP Registry
        run: ./mcp-publisher publish
